<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Julgi">
<meta name="theme-color" content="#f4f2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0e11" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" href="/icon.png">
<title>Julgi</title>
<style>
/* 폰에서 보는 Julgi. 아래 탭 셋(홈, 세션, 한 일)과 가운데의 새 일 단추. 세션 하나는 그 위로 밀려 올라오고, 새 일은 아래에서 올라오는 판이다 */
:root {
  --bg: #f4f2ec; --surface: #ffffff; --sunk: #ebe8e0; --ink: #17181c; --muted: #6a6c74; --faint: #9a9ca4; --line: #e2ded4;
  --accent: #2a6bd1; --accent-soft: #e3ecfb; --on-accent: #ffffff; --wait: #c25e06; --wait-soft: #fcefdc; --ok: #24854f; --ok-soft: #dff3e7; --bad: #b3261e;
  --shadow: 0 1px 2px rgb(20 20 30 / 0.05), 0 6px 20px rgb(20 20 30 / 0.06); --bar: 62px;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0d0e11; --surface: #17181d; --sunk: #20222a; --ink: #eceef2; --muted: #8f939d; --faint: #666a74; --line: #272a32;
  --accent: #7fb2ff; --accent-soft: #18294a; --on-accent: #0d0e11; --wait: #ffa551; --wait-soft: #33230e; --ok: #5fd39a; --ok-soft: #10301f; --bad: #ff8a80;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 8px 24px rgb(0 0 0 / 0.35);
} }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, "SF Pro Text", "Apple SD Gothic Neo", system-ui, sans-serif; -webkit-text-size-adjust: 100%; overscroll-behavior-y: none; -webkit-font-smoothing: antialiased; }
button, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
[hidden] { display: none !important; }
.app { max-width: 640px; margin: 0 auto; min-height: 100dvh; padding: 0 max(18px, env(safe-area-inset-right, 0px)) 0 max(18px, env(safe-area-inset-left, 0px)); }

/* 위 막대: 화면 이름을 크게. 내리면 흐린 바탕으로 붙는다 */
.top { position: sticky; top: 0; z-index: 5; margin: 0 -18px; padding: calc(12px + env(safe-area-inset-top, 0px)) 18px 10px; display: flex; align-items: center; gap: 10px; background: color-mix(in srgb, var(--bg) 86%, transparent); -webkit-backdrop-filter: saturate(1.6) blur(18px); backdrop-filter: saturate(1.6) blur(18px); }
.top h1 { flex: 1; min-width: 0; margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top.small h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; text-align: center; }
.top .back { display: flex; align-items: center; gap: 1px; color: var(--accent); font-size: 17px; padding: 6px 10px 6px 0; margin-left: -6px; }
.top .back svg { width: 22px; height: 22px; }
.top .side { width: 64px; flex: none; display: flex; justify-content: flex-end; }
.conn { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
.conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
.conn.off i { background: var(--bad); box-shadow: none; }
.banner { background: var(--surface); border: 1px solid var(--bad); color: var(--bad); border-radius: 14px; padding: 11px 14px; font-size: 14px; margin: 2px 0 12px; }

.view { padding-bottom: calc(var(--bar) + 92px + env(safe-area-inset-bottom, 0px)); animation: in 0.18s ease-out; }
@keyframes in { from { opacity: 0; transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { .view, .sheet, .pulse { animation: none !important; } }
h2 { margin: 26px 2px 10px; font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.01em; display: flex; align-items: baseline; gap: 6px; }
h2 i { font-style: normal; font-weight: 500; color: var(--faint); }
h2.mine { color: var(--wait); }
.card { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }

/* 홈 맨 위의 요약: 지금 나를 기다리는 것이 몇 개인가 */
.hero { padding: 18px 18px 16px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; }
.hero .big { font-size: 44px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; color: var(--wait); font-variant-numeric: tabular-nums; }
.hero.calm .big { color: var(--ok); }
.hero .big, .hero .what { grid-column: 1; }
.hero .what { font-size: 16px; font-weight: 700; margin-top: 6px; }
.hero .rest { grid-column: 1 / -1; font-size: 13.5px; color: var(--muted); }
.hero img { width: 72px; height: 72px; grid-row: 1 / 3; grid-column: 2; }
.meters { grid-column: 1 / -1; display: grid; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.meter { display: grid; grid-template-columns: 74px 1fr 40px; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted); }
.meter span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meter b { font-weight: 700; color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }
.meter i { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; display: block; }
.meter i u { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
.meter.hot i u { background: var(--wait); }

/* 나를 기다리는 세션: 무엇을 기다리는지까지 보인다 */
.need { display: block; width: 100%; text-align: left; padding: 15px 16px; }
.need + .need { border-top: 1px solid var(--line); }
.need:active, .row:active { background: var(--sunk); }
.need .name { display: flex; align-items: flex-start; gap: 10px; }
.need .name b { flex: 1; min-width: 0; font-size: 16.5px; font-weight: 700; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.need .meta { font-size: 13px; color: var(--muted); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.need .why { margin-top: 10px; background: var(--wait-soft); border-radius: 12px; padding: 9px 12px; font-size: 14.5px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.pill { flex: none; font-size: 11.5px; font-weight: 700; border-radius: 999px; padding: 3px 9px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.pill.mine { background: var(--wait-soft); color: var(--wait); }
.pill.run { background: var(--accent-soft); color: var(--accent); }
.row { display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 13px 16px; min-height: 62px; }
.row + .row { border-top: 1px solid var(--line); }
.row b { display: block; font-weight: 600; font-size: 16px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.dot.mine { background: var(--wait); }
.dot.run { background: var(--accent); }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.3; } }
.chev { width: 16px; height: 16px; color: var(--faint); }
.empty { text-align: center; color: var(--muted); font-size: 15px; padding: 44px 24px 20px; }
.empty img { width: 132px; height: 132px; }
.empty b { display: block; color: var(--ink); font-size: 18px; font-weight: 700; margin: 6px 0 4px; }
.act { padding: 12px 16px; font-size: 14.5px; line-height: 1.45; overflow-wrap: anywhere; }
.act + .act { border-top: 1px solid var(--line); }
.act .kind { display: inline-block; font-size: 11.5px; font-weight: 700; border-radius: 6px; padding: 1px 7px; background: var(--sunk); color: var(--muted); margin-right: 8px; }
.act small { display: block; color: var(--faint); font-size: 12px; margin-top: 3px; }
.skel { height: 62px; border-radius: 18px; background: linear-gradient(90deg, var(--surface), var(--sunk), var(--surface)); background-size: 200% 100%; animation: skel 1.2s linear infinite; margin-top: 10px; }
@keyframes skel { to { background-position: -200% 0; } }

/* 아래 탭 막대와 가운데의 새 일 단추 */
.tabs { position: fixed; z-index: 6; left: 0; right: 0; bottom: 0; padding: 0 max(10px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(10px, env(safe-area-inset-left, 0px)); background: color-mix(in srgb, var(--surface) 84%, transparent); -webkit-backdrop-filter: saturate(1.6) blur(22px); backdrop-filter: saturate(1.6) blur(22px); border-top: 1px solid var(--line); }
.tabs nav { max-width: 640px; margin: 0 auto; height: var(--bar); display: grid; grid-template-columns: repeat(3, 1fr); align-items: center; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 600; color: var(--faint); padding: 8px 0 6px; position: relative; }
.tab svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab.on { color: var(--accent); }
.tab .badge { font-style: normal; position: absolute; top: 3px; left: calc(50% + 6px); min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px; background: var(--wait); color: #fff; font-size: 11px; font-weight: 800; line-height: 18px; text-align: center; }
.plus { position: fixed; z-index: 7; right: max(18px, calc(50vw - 302px)); bottom: calc(var(--bar) + 16px + env(safe-area-inset-bottom, 0px)); height: 54px; padding: 0 20px 0 16px; border-radius: 27px; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 800; box-shadow: 0 8px 22px color-mix(in srgb, var(--accent) 45%, transparent); transition: transform 0.12s; }
.plus:active { transform: scale(0.94); }
.plus svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }

/* 세션 하나: 마지막 답과 답 쓰는 칸 */
#one { padding-bottom: 0; min-height: calc(100dvh - 60px); display: flex; flex-direction: column; }
.status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); padding: 0 2px 12px; min-width: 0; }
.status > span:not(.pill) { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bubble { background: var(--surface); border-radius: 18px 18px 18px 6px; box-shadow: var(--shadow); padding: 15px 17px; overflow-wrap: anywhere; font-size: 15.5px; line-height: 1.58; }
.bubble.note { color: var(--muted); text-align: center; box-shadow: none; background: none; padding: 48px 16px; }
.bubble p { margin: 0 0 11px; white-space: pre-wrap; }
.bubble > :last-child { margin-bottom: 0; }
.bubble ul { margin: 0 0 11px; padding-left: 20px; }
.bubble ol { margin: 0 0 11px; padding-left: 22px; }
.bubble li { margin-bottom: 3px; }
.bubble a { color: var(--accent); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent); text-underline-offset: 2px; overflow-wrap: anywhere; }
.bubble hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
.bubble blockquote { margin: 0 0 11px; padding: 2px 0 2px 12px; border-left: 3px solid var(--line); color: var(--muted); white-space: pre-wrap; }
/* 표는 폰 폭보다 넓어질 수 있다. 칸마다 읽을 만한 폭을 주고 옆으로 밀어 본다 */
.bubble .table { margin: 0 -17px 11px; padding: 0 17px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.bubble table { border-collapse: collapse; font-size: 14px; line-height: 1.45; min-width: 100%; }
.bubble th, .bubble td { border: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; min-width: 96px; max-width: 240px; }
.bubble th { background: var(--sunk); font-weight: 700; white-space: nowrap; }
.bubble h4 { margin: 14px 0 6px; font-size: 16.5px; }
.bubble code { font: 13.5px/1.5 ui-monospace, "SF Mono", Menlo, monospace; background: var(--sunk); border-radius: 6px; padding: 1px 5px; }
.bubble pre { margin: 0 0 11px; background: var(--sunk); border-radius: 12px; padding: 11px 13px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.bubble pre code { background: none; padding: 0; white-space: pre; }
.bubble .more { display: block; width: 100%; color: var(--accent); font-size: 14px; font-weight: 600; padding: 0 0 11px; margin-bottom: 11px; text-align: left; border-bottom: 1px solid var(--line); }
.now { margin: 0 0 12px; padding: 10px 12px; border-radius: 12px; background: var(--sunk); color: var(--muted); font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
.now::before { content: attr(data-label); display: block; font: 800 11.5px/1.4 -apple-system, system-ui, sans-serif; color: var(--accent); margin-bottom: 4px; }
#one.live .now, #one.live .me { display: none; }
.me { align-self: flex-end; max-width: 86%; margin: 0 0 10px; background: color-mix(in srgb, var(--accent) 14%, var(--surface)); border-radius: 18px 18px 6px 18px; padding: 10px 14px; font-size: 14.5px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.steps li.cur span::after { content: ""; display: inline-block; width: 7px; height: 7px; margin-left: 7px; border-radius: 50%; background: var(--accent); vertical-align: middle; animation: blink 1s ease-in-out infinite; }
@keyframes blink { 50% { opacity: 0.2; } }
.steps { margin-top: 10px; font-size: 13.5px; color: var(--muted); }
.steps summary { padding: 6px 4px; font-weight: 700; }
.steps ol { list-style: none; margin: 0; padding: 0 4px; }
.steps li { display: flex; gap: 8px; padding: 3px 0; line-height: 1.45; overflow-wrap: anywhere; }
.steps li b { flex: none; min-width: 34px; color: var(--accent); font-weight: 700; }
.steps li.say { color: var(--ink); }
.steps li.say b { display: none; }
.bubble .asked { margin-top: 13px; background: var(--wait-soft); border-radius: 13px; padding: 11px 13px; }
.bubble .asked > :last-child { margin-bottom: 0; }
.bubble .asked::before { content: attr(data-label); display: block; font-size: 12px; font-weight: 800; color: var(--wait); margin-bottom: 3px; }
.grow { flex: 1; min-height: 14px; }
.status .live { margin-left: auto; flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 700; color: var(--accent); }
.status span:last-of-type { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
#one.live { height: calc(100dvh - 60px); min-height: 0; }
#one.live .bubble, #one.live .steps, #one.live .grow, #one.live .quick, #one:not(.live) #one-term, #one:not(.live) #keys { display: none; }
#one-term { flex: 1; min-height: 0; margin: 0 -18px; padding: 6px 6px 0; overflow: hidden; touch-action: none; position: relative; }
#one-term .halt { position: absolute; inset: auto 12px 12px; display: flex; align-items: center; gap: 10px; background: var(--surface); color: var(--ink); border-radius: 14px; box-shadow: var(--shadow); padding: 11px 14px; font-size: 14px; z-index: 3; }
#one-term .halt button { margin-left: auto; flex: none; color: var(--accent); font-weight: 700; }
#keys { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 9px; margin: 0 -18px; padding-left: 18px; padding-right: 18px; scrollbar-width: none; }
#keys::-webkit-scrollbar { display: none; }
#keys button { flex: none; min-width: 44px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; font: 600 13.5px ui-monospace, "SF Mono", Menlo, monospace; }
#keys button:active { background: var(--sunk); }
.composer { position: sticky; bottom: 0; z-index: 4; margin: 0 -18px; padding: 10px 18px calc(10px + env(safe-area-inset-bottom, 0px)); background: color-mix(in srgb, var(--bg) 90%, transparent); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
.quick { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 9px; margin: 0 -18px; padding-left: 18px; padding-right: 18px; scrollbar-width: none; }
.quick::-webkit-scrollbar { display: none; }
.quick button, .chip { flex: none; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 8px 15px; font-size: 14.5px; font-weight: 500; box-shadow: 0 1px 2px rgb(0 0 0 / 0.04); }
.quick button:active, .chip:active { background: var(--sunk); }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.write { display: flex; align-items: flex-end; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 6px 6px 6px 17px; }
.write:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.write textarea { flex: 1; min-width: 0; border: 0; outline: 0; background: none; resize: none; font-size: 16px; line-height: 1.4; padding: 7px 0; max-height: 38dvh; }
.send { flex: none; width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; transition: transform 0.12s, background 0.12s; }
.send:active { transform: scale(0.92); }
.send svg { width: 19px; height: 19px; }
.send:disabled { background: var(--sunk); color: var(--faint); }

/* 새 일: 아래에서 올라오는 판 */
.veil { position: fixed; inset: 0; z-index: 8; background: rgb(0 0 0 / 0.42); animation: fade 0.18s ease-out; }
@keyframes fade { from { opacity: 0; } }
.sheet { position: fixed; z-index: 9; left: 0; right: 0; bottom: 0; max-width: 640px; margin: 0 auto; background: var(--bg); border-radius: 22px 22px 0 0; padding: 10px 18px calc(18px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -10px 40px rgb(0 0 0 / 0.25); animation: up 0.24s cubic-bezier(0.2, 0.8, 0.2, 1); max-height: 92dvh; overflow-y: auto; }
@keyframes up { from { transform: translateY(100%); } }
.sheet .grip { width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
.sheet .head { display: flex; align-items: center; margin-bottom: 14px; }
.sheet .head b { flex: 1; font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
.sheet .head button { color: var(--accent); font-size: 16px; padding: 4px 0 4px 12px; }
.sheet label { display: block; font-size: 12.5px; font-weight: 700; color: var(--muted); margin: 0 2px 8px; }
.places { display: flex; gap: 8px; overflow-x: auto; margin: 0 -18px 16px; padding: 0 18px 2px; scrollbar-width: none; }
.places::-webkit-scrollbar { display: none; }
.sheet textarea { display: block; width: 100%; min-height: 150px; border: 1px solid var(--line); outline: 0; background: var(--surface); border-radius: 16px; padding: 13px 15px; font-size: 16px; line-height: 1.5; resize: none; }
.sheet textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.go { display: block; width: 100%; margin-top: 14px; background: var(--accent); color: var(--on-accent); font-weight: 800; font-size: 16.5px; border-radius: 16px; padding: 15px; transition: transform 0.12s, opacity 0.12s; }
.go:active { transform: scale(0.985); }
.go:disabled { opacity: 0.4; }
.hint { color: var(--muted); font-size: 13px; text-align: center; margin-top: 10px; }
.choices { display: flex; flex-direction: column; gap: 7px; padding-bottom: 10px; }
.choices .ask { font-size: 12.5px; font-weight: 800; color: var(--wait); }
.choices button, .need .opts button { display: flex; gap: 10px; align-items: baseline; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 11px 14px; font-size: 15px; line-height: 1.35; }
.choices button b, .need .opts button b { flex: none; color: var(--accent); font-weight: 800; }
.choices button.on { border-color: var(--accent); }
.choices button:active, .need .opts button:active { background: var(--sunk); }
.need .opts { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.need .opts button { padding: 9px 12px; font-size: 14px; }
.status button.act { flex: none; font-size: 12.5px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 4px 10px; }
.status button.act.stop { color: var(--wait); background: var(--wait-soft); }
.status button.act.armed { color: var(--on-accent); background: var(--wait); }
.attach { flex: none; width: 34px; height: 38px; margin-left: -9px; color: var(--muted); display: grid; place-items: center; }
.attach svg { width: 22px; height: 22px; }
.quick button.more { color: var(--muted); }
#diff-body details { border-top: 1px solid var(--line); }
#diff-body summary { display: flex; gap: 8px; padding: 10px 2px; font: 600 13px ui-monospace, "SF Mono", Menlo, monospace; overflow-wrap: anywhere; }

function inline(node, text) {

const cells = (line) => line.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());

    const line = lines[i];

      flush();

      for (i++; i < lines.length && !/^\s*```/.test(lines[i]); i++) code.push(lines[i]);

    }
    const csig = s ? choiceSig(s) : "";
    if ($("choices").dataset.sig !== csig) {
      $("choices").dataset.sig = csig;
      $("choices").hidden = !csig;
      $("choices").replaceChildren(...(csig ? [el("div", "ask", T("확인이 필요함")), optsOf(s, "list")] : []));
      $("quick").hidden = !!csig;
    }
    // 일하는 중이면 맥의 화면 끝 몇 줄을 그대로 보여 준다. 대화 기록에 적히기 전의 진행이 여기 보인다
    $("one-now").hidden = !(s && busy(s) && s.now); $("one-now").dataset.label = T("지금 화면"); $("one-now").textContent = (s && s.now) || "";
    if (s) { loadReply(s); loadSteps(s); }
  } else {
    const sig = JSON.stringify([view, state.sessions.map(({ now, ...rest }) => rest), state.sleeping, state.usage, state.ruleRuns, state.acts && state.acts[0], Math.floor(Date.now() / 60000)]);
    if ($(view).dataset.sig === sig) return;
    $(view).dataset.sig = sig;
    if (view === "home") paintHome();
    else if (view === "all") paintAll();
    else paintActs();
  }
}
const pull = () => api("/api/state").then((s) => {
  delete $("banner").dataset.auth; if (s && s.sessions) state = s;
  // 깨운 세션이 열렸으면 그 세션으로 간다
  const woke = wantWake && state && state.sessions.find((x) => x.id === wantWake);
  if (woke) { wantWake = ""; show("one", woke.key); return; }
  paint();
}, (code) => { if (code === 401) { $("banner").dataset.auth = "1"; $("banner").hidden = false; $("conn").classList.add("off"); $("banner").textContent = T("토큰이 맞지 않는다. 맥의 Julgi 설정(⌘,)에 나온 주소로 다시 연다."); } else paint(); });

const grow = (t) => { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; };
function send(text) {
  if (!text || !picked || $("answer").dataset.busy) return;
  $("answer").dataset.busy = "1"; $("answer-send").disabled = true;
  const key = picked;
  api("/api/answer", { target: key, text }).then(() => { store.set("draft:" + key, ""); $("answer-text").value = ""; grow($("answer-text")); sent = { key, text, at: Date.now() }; shownFor = ""; const s = state && state.sessions.find((x) => x.key === key); if (s) { loadReply(s); paintTurn(s, "", [], true); } pull(); }, () => { toast(T("보내지 못했다")); $("answer-send").disabled = !$("answer-text").value.trim(); }).finally(() => delete $("answer").dataset.busy);
}
$("answer-text").addEventListener("input", (e) => { grow(e.target); $("answer-send").disabled = !e.target.value.trim(); });
$("answer").addEventListener("submit", (e) => { e.preventDefault(); send($("answer-text").value.trim()); });
$("throw-text").addEventListener("input", (e) => ($("throw-send").disabled = !e.target.value.trim() || !where));
$("throw").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("throw-text").value.trim();
  if (!text || !where) return;
  $("throw-send").disabled = true; store.set("where", where);
  api("/api/new", { target: where, text }).then(() => { $("throw-text").value = ""; toast(T("던졌다. 곧 세션이 열린다")); history.back(); }, () => { toast(T("던지지 못했다")); $("throw-send").disabled = false; });
});
$("back").addEventListener("click", () => history.back());
$("throw-close").addEventListener("click", () => history.back());
$("veil").addEventListener("click", () => ($("diff").hidden ? history.back() : closeDiff()));
$("diff-close").addEventListener("click", closeDiff);
// 그림 붙이기: 폰에서 줄여 JPEG로 올리고, 맥에 놓인 경로를 답에 적는다. Claude Code는 경로를 보고 그림을 읽는다
$("attach").addEventListener("click", () => $("attach-file").click());
$("attach-file").addEventListener("change", async (e) => {
  const file = e.target.files && e.target.files[0]; e.target.value = "";
  if (!file) return;
  toast(T("그림을 올리는 중"));
  try {
    const url = URL.createObjectURL(file);
    const img = await new Promise((ok, fail) => { const i = new Image(); i.onload = () => ok(i); i.onerror = fail; i.src = url; });
    const scale = Math.min(1, 1800 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
    const blob = await new Promise((ok) => c.toBlob(ok, "image/jpeg", 0.85));
    const r = await fetch("/api/upload?ext=jpg", { method: "POST", headers: { "x-julgi-token": token }, body: blob });
    if (!r.ok) throw r.status;
    const { path } = await r.json();
    const t = $("answer-text"); t.value = (t.value.trim() ? t.value.trimEnd() + "\n" : "") + T("그림: {0}", path) + "\n"; grow(t); $("answer-send").disabled = false; t.focus();
    toast(T("그림을 붙였다"));
  } catch (err) { toast(T("그림을 올리지 못했다")); }
});
$("new").addEventListener("click", () => show("throw"));
for (const b of document.querySelectorAll(".tab")) b.addEventListener("click", () => show(b.dataset.tab));
// 폰의 뒤로 가기(스와이프)가 세션 하나와 새 일 판을 닫게, 화면을 주소의 # 뒤에 적는다
const route = () => {
  const h = location.hash;
  if (h === "#new") return show("throw", "", true);
  $("throw").hidden = $("veil").hidden = true;
  if (h.startsWith("#s=")) show("one", decodeURIComponent(h.slice(3)), true);
  else show(TABS.includes(h.slice(1)) ? h.slice(1) : view === "one" ? "home" : view, "", true);
};
window.addEventListener("popstate", route);
paint();
pull().then(route, route);
// 세션 하나를 보는 동안은 1초마다, 그 밖에는 3초마다 읽는다
let beat = 0;
setInterval(() => { if (view === "one" || beat++ % 3 === 0) pull(); }, 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) pull(); });
</script>
</body>
</html>
